pipeline:
  default_top_n: 10
  default_horizons: [3, 5, 10]
  recommendation_dir: "data/recommendations"
  report_dir: "data/recommendations/validation"
  db_path: "data/recommendations.db"
  run_meta_path: "logs/pipeline_runs.jsonl"

error_handling:
  retry_attempts: 3
  retry_backoff_seconds: [2, 5, 10]
  allow_stale_data: true
  allow_training_skip: true
  allow_validation_skip: false

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s - %(message)s"
  file: "logs/pipeline.log"

monitoring:
  enabled: true
  rolling_window_days: 20
  horizon: 5
  ic_threshold: 0.04
  hit_rate_threshold: 0.55
  retrain_trigger_mode: "auto"  # auto / manual
  retrain_threshold:
    ic_degrade_ratio: 0.3
    consecutive_low_days: 5
  retrain_strategy: "incremental"  # incremental / full
