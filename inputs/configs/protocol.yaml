# A-share Low-Frequency Lab - 交易协议配置
# 详细文档见：docs/protocol.md

# ============================================================
# 信号与成交时点
# ============================================================

# 信号生成时点
# - "close": 收盘后计算（t 日 close 可用）
# - "intraday": 盘中信号（V2 扩展，需分钟线数据）
signal_time_mode: "close"

# 成交时点
# - "next_open": 次日开盘成交（t+1 日 open 价格）
# - "next_close": 次日收盘成交（V2 扩展）
# - "intraday": 盘中成交（V2 扩展）
execution_time_mode: "next_open"

# ============================================================
# 持有周期与调仓
# ============================================================

# 调仓频率
# - "daily": 每日评估（但不一定每天都调仓）
# - "weekly": 每周调仓（V2 扩展）
# - "monthly": 每月调仓（V2 扩展）
rebalance_frequency: "daily"

# 最小持有天数（null 表示无限制）
# - 避免高频换手，降低成本
# - V0 不强制，V1 可启用
min_holding_days: null

# ============================================================
# 换仓门槛（降低成本侵蚀）
# ============================================================

# 是否启用换仓门槛
# - true: 仅当新候选相对当前持仓的优势超过阈值时才换仓
# - false: 每次信号都执行调仓
enable_rebalance_threshold: true

# 换仓分数优势阈值
# - 新候选的分数 - 当前持仓的分数 > threshold 才换仓
# - 建议值：0.03 ~ 0.10（根据策略信号特性调整）
rebalance_score_threshold: 0.05

# 最小预期边际收益（应覆盖 N 倍成本）
# - 预期边际收益 > N * expected_cost 才允许交易
# - 建议值：0.003（千分之三，覆盖单边成本的 3 倍）
min_expected_excess: 0.003

# ============================================================
# 做 T 策略
# ============================================================

# 是否启用日内做 T
# - true: 支持盘中买入 → 盘中/尾盘卖出（需分钟线数据）
# - false: 仅支持日线调仓（V0/V1 默认）
enable_intraday_trading: false

# ============================================================
# 风控
# ============================================================

# 单日最大亏损阈值（从前一日收盘权益计算）
# - 触发后：停止开新仓，仅允许降风险
# - 建议值：0.02（2%）
max_daily_loss: 0.02

# 风控触发后行为
# - "stop_buy": 停止开仓（买入订单取消）
# - "liquidate_all": 全部清仓（V2 扩展，需谨慎）
risk_control_mode: "stop_buy"

# ============================================================
# 成本模型
# ============================================================

# 最低手续费（RMB）
# - A 股券商通常最低收费 5 元
min_commission: 5.0

# 手续费费率（总摩擦成本）
# - 包含佣金、印花税、过户费等
# - 保守估计：千分之一（0.001）
commission_rate: 0.001

# ============================================================
# 调试与诊断
# ============================================================

# 是否记录详细诊断信息
# - true: 输出成交失败原因统计（diagnostics.csv）
# - false: 仅输出基础回测指标
enable_diagnostics: true

# 是否保存每日持仓快照
# - true: 输出每日持仓明细（positions.csv）
# - false: 仅输出权益曲线和交易明细
save_daily_positions: false

# ============================================================
# V0 版本说明
# ============================================================
# 当前 V0 版本已实现：
# - 日线数据（收盘后信号 → 次日开盘成交）
# - T+1 约束、涨跌停阻断、停牌处理
# - 单日亏损阈值风控（2%）
# - 成本逐笔扣除（max(5元, 成交额 * 0.001)）
#
# V1 规划：
# - 换仓门槛与成本覆盖阈值
# - 最小持有期配置
# - 基本面数据接入（按 announce_date 对齐）
#
# V2 规划：
# - 分钟线数据支持
# - 盘中信号生成与成交
# - 日内做 T 策略
