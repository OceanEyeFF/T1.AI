# =============================================================================
# data_source.toml — lab/scripts 全局默认源（历史双轨）
# AO-O3 (WT-R4-A4-T4): 本文件 ≠ MS-R4 湖合同权威入口。
#
# 双轨说明：
#   1) 本文件 `default_source` 仍可为 akshare，供部分 lab/脚本历史默认读取。
#   2) MS-R4 / DataLake 主合同以 `ashare_infra.lake.r4_contract.make_r4_datalake`
#      为准（TuShare primary、qfq、refresh=False、cache=`inputs/data/cache`）。
#      见 `.servo/worktrack/WT-R4-A1-lake-source-contract.md`。
#   3) `DatasetConfig.source` 代码默认已是 `"tushare"`（R4）；与本文件 default
#      解耦——改本文件不会自动改 DatasetBuilder / make_r4_datalake。
# =============================================================================
default_source: "akshare"  # 可选: akshare, tushare, odp（lab 历史默认；非 R4 湖权威）
fallback: "akshare"
sources:
  akshare:
    description: "本地免费数据源，适合回测与开发；非 R4 主合同"
  tushare:
    description: "TuShare Pro — MS-R4 日频湖 primary（请用 DataLake / make_r4_datalake）"
    token_env: "TUSHARE_TOKEN"
    cache_dir: "inputs/data/cache"
  odp:
    description: "OpenBB ODP 数据源（默认 yfinance provider）"
    provider: "yfinance"
    interval: "1d"
    # 可选：当本机运行 ODP REST 服务时启用（默认优先 SDK）
    # base_url: "http://127.0.0.1:8000"
    # prefer_rest: true
    cache_dir: "inputs/data/cache"
