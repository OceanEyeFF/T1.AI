# Global lab/scripts default (historical). MS-R4 lake work uses TuShare primary via
# ashare_infra.lake.r4_contract.make_r4_datalake (see WT-R4-A1-lake-source-contract).
default_source: "akshare"  # 可选: akshare, tushare, odp
fallback: "akshare"
sources:
  akshare:
    description: "本地免费数据源，适合回测与开发；非 R4 主合同"
  tushare:
    description: "TuShare Pro — MS-R4 日频湖 primary（DataLake / make_r4_datalake）"
    token_env: "TUSHARE_TOKEN"
    cache_dir: "inputs/data/cache"
  odp:
    description: "OpenBB ODP 数据源（默认 yfinance provider）"
    provider: "yfinance"
    interval: "1d"
    # 可选：当本机运行 ODP REST 服务时启用（默认优先 SDK）
    # base_url: "http://127.0.0.1:8000"
    # prefer_rest: true
    cache_dir: "inputs/data/cache"
