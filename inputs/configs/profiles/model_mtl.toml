model:
  input_dim: 11              # 6 -> 11: 新增5个技术指标特征
  d_model: 128
  n_heads: 4
  n_layers: 4                # 回到4层：6层对数据集太复杂
  d_ff: 512
  dropout: 0.25             # 0.15 -> 0.25: 更强的正则化
  min_seq_len: 20           # 恢复最优的20天窗口
  max_seq_len: 512
  loss_weights: [1.0, 1.0, 1.0]
  loss_type: "l1"     # "l1" (默认) 或 "ic_aware" (优化IC)
  loss_alpha: 0.3           # IC-Aware Loss的α参数: 0.3 = 30% L1 + 70% IC

training:
  batch_size: 64            # 32 -> 64: IC-Aware Loss需要更大batch来稳定IC估计
  learning_rate: 1e-5       # 5e-6 -> 1e-5: 平衡学习速度和稳定性
  weight_decay: 1e-4        # 5e-5 -> 1e-4: 更强的权重衰减
  max_epochs: 100            # 50 -> 30: IC-Aware在极早期就达最优
  early_stopping_patience: 8   # 5 -> 2: 极早停止，抓住最佳时刻
  early_stopping_metric: "val_ic"
  early_stopping_threshold: 0.12  # 0.12 -> 0.15: 提高期望阈值

data:
  seq_len: 20               # 恢复最优的20天窗口
  train_ratio: 0.7
  valid_ratio: 0.15
  test_ratio: 0.15

output:
  model_dir: "workspace/checkpoints"
  log_dir: "workspace/runs"
  save_best_only: true

incremental_training:
  enabled: true
  trigger_schedule: "weekly"         # weekly / daily / manual
  min_labeled_samples: 100           # 最小标签样本数（<100 跳过训练）
  freeze_layers: 2                   # 冻结前 2 个 encoder 层
  learning_rate: 1e-5                # 小学习率（全量训练为 1e-4）
  max_epochs: 3                      # 短训练（全量训练为 50）
  early_stopping_patience: 8
  warm_start_checkpoint: "workspace/checkpoints/latest_mtl.pt"
  save_checkpoint: "workspace/checkpoints/latest_mtl.pt"  # 原子写入（临时文件 + rename）
