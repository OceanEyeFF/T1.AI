[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-lab"
version = "0.1.0"
description = "A-share low-frequency lab: daily evaluation, low-turnover execution under strict A-share constraints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "tushare>=1.2",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "xgboost>=3.2",
  "optuna>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ashare_lab*", "ashare_infra*", "ashare_exec*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "unit: fast pure-logic unit tests",
  "integration: multi-module / filesystem integration tests",
  "contract: repo file / CLI / report schema contracts",
  "slow: long-running tests",
  "gpu: requires CUDA",
]

[tool.coverage.run]
source = ["src/ashare_lab", "src/ashare_infra", "src/ashare_exec"]

[tool.coverage.report]
# Acc-balanced (MS-T1-001 / WT-T1-A4): measured TOTAL 78% on 2026-07-14;
# lock max(70, baseline-2) => 76. Fast lane does not run --cov.
fail_under = 76
