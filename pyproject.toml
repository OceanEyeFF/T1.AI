[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-lab"
version = "0.1.0"
description = "A-share low-frequency lab: daily evaluation, low-turnover execution under strict A-share constraints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "akshare>=1.13",
  "tushare>=1.2",
  "pyyaml>=6.0",
  "pyarrow>=14.0",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "xgboost>=3.2",
  "optuna>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["src/ashare_lab"]
omit = [
  "scripts/build_dataset.py",
  "scripts/build_dataset_multi_stock.py",
  "scripts/evaluate_model.py",
  "scripts/run_backtest.py",
  "scripts/train_baseline_models.py",
  "scripts/train_model.py",
  "scripts/train_mtl.py",
]

[tool.coverage.report]
fail_under = 90
